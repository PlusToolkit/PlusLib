# Set update schedule for GitHub Actions

version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" only covers .github/workflows; local composite actions have to be
    # listed separately for their "uses:" lines to be updated too.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    commit-message:
      # Prefix all commit messages with "COMP: "
      prefix: "COMP"
