name: Build Plus

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
        default: x64
      os:
        required: true
        type: string
      # Dependency versions
      qt-version:
        required: false
        type: string
        default: '5.15.0'
      vtk-cache-key:
        required: true
        type: string
      itk-cache-key:
        required: true
        type: string

      # Plus cache
      plus-cache-key:
        required: false
        type: string
      clear-plus-cache:
        required: false
        type: boolean
        default: false

      # Plus build options
      plus-config:
        required: true
        type: string

      # Uploaded archive name
      archive-name:
        required: false
        type: string
        default: PlusInstaller

      # Repos/tags for PlusLib and PlusApp
      pluslib-repository:
        required: false
        type: string
        default: https://github.com/PlusToolkit/PlusLib.git
      pluslib-tag:
        required: false
        type: string
        default: master
      plusapp-repository:
        required: false
        type: string
        default: https://github.com/PlusToolkit/PlusApp.git
      plusapp-tag:
        required: false
        type: string
        default: master

      use-pltools:
        required: false
        type: boolean
        default: false

      # Run the PlusLib test suite (in build/PlusLib-bin) after the build.
      run-tests:
        required: false
        type: boolean
        default: false
      # CDash model for the PlusLib test submission: Experimental or Nightly.
      test-model:
        required: false
        type: string
        default: Experimental
      # Optional CDash track for the PlusLib test submission.
      test-track:
        required: false
        type: string
        default: ''
      # Extra ctest arguments for the PlusLib test run (e.g. -E <regex>).
      ctest-extra-args:
        required: false
        type: string
        default: ''

    secrets:
      pltools-access-token:
        required: false

jobs:
  build:
    runs-on: ${{ inputs.os }}
    permissions:
      actions: write

    steps:
    - name: Restore VTK Cache
      uses: actions/cache/restore@v6
      with:
        path: vtk-install
        key: ${{ inputs.vtk-cache-key }}

    - name: Restore ITK Cache
      uses: actions/cache/restore@v6
      with:
        path: itk-install
        key: ${{ inputs.itk-cache-key }}

    # actions/cache never overwrites an existing key, so a fixed plus-cache-key
    # (e.g. plus-latest-x64) would otherwise never refresh once created.
    - name: Clear Plus Cache
      if: ${{ inputs.clear-plus-cache && inputs.plus-cache-key != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh cache delete "${{ inputs.plus-cache-key }}" --repo ${{ github.repository }} || true

    - name: Plus Cache
      if: ${{ inputs.plus-cache-key != '' }}
      id: cache-plus
      uses: actions/cache@v6
      with:
        path: build
        key: ${{ inputs.plus-cache-key }}

    - name: Install CMake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: 4.3.4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        dir: ${{ github.workspace }}/Qt
        version: ${{ inputs.qt-version }}
        arch: ${{ inputs.arch == 'x64' && 'win64_msvc2019_64' || 'win32_msvc2019' }}

    - name: Install NSIS
      uses: repolevedavaj/install-nsis@v1.3.0
      with:
        nsis-version: '3.12'

    - name: Clone PlusBuild
      uses: actions/checkout@v7
      with:
        repository: PlusToolkit/PlusBuild
        ref: master
        path: PlusBuild

    - name: Clone PLTools
      if: ${{ inputs.use-pltools }}
      uses: actions/checkout@v7
      with:
        repository: PerkLab/PLTools
        ref: master
        path: PLTools
        token: ${{ secrets.pltools-access-token }}

    - name: Configure PlusBuild
      run: |
        cmake -S PlusBuild -B build `
          -G "Visual Studio 18 2026" -A ${{ inputs.arch }} `
          -DCMAKE_BUILD_TYPE=Release `
          -DPLUSLIB_GIT_REPOSITORY=${{ inputs.pluslib-repository }} `
          -DPLUSLIB_GIT_REVISION=${{ inputs.pluslib-tag }} `
          -DPLUSAPP_GIT_REPOSITORY=${{ inputs.plusapp-repository }} `
          -DPLUSAPP_GIT_REVISION=${{ inputs.plusapp-tag }} `
          -DQt5_Dir="${QT_DIR}" `
          ${{ inputs.plus-config }}

    - name: Build
      shell: pwsh
      working-directory: ${{ github.workspace }}/build
      run: |
        cmake --build . --config Release
        if ($LASTEXITCODE -ne 0) {
          throw "CMake build failed with exit code $LASTEXITCODE"
        }
        ctest -C Release -D Experimental -V
        if ($LASTEXITCODE -ne 0) {
          throw "CTest failed with exit code $LASTEXITCODE"
        }

    # The runners have no GPU, so VTK cannot create a render window. Tests that
    # generate report plots (the calibration algorithm tests) crash without a
    # software OpenGL implementation. This installs Mesa system-wide.
    - name: Setup headless display
      if: ${{ inputs.run-tests }}
      uses: pyvista/setup-headless-display-action@b0bf9f57d62d2b3fee9f1c0e0c7e390f05e97a4e # v5.0.0
      with:
        pyvista: false

    # PlusBuild itself declares no tests; the PlusLib test suite lives in the
    # inner PlusLib-bin build tree and has to be run there.
    # -M/-T rather than -D so that no Update step runs (it would move the
    # checkout off the requested PlusLib revision) and the tree is not rebuilt.
    - name: Test PlusLib
      id: plus-tests
      if: ${{ inputs.run-tests }}
      shell: pwsh
      working-directory: ${{ github.workspace }}/build/PlusLib-bin
      run: |
        $ctestArgs = @()
        if ('${{ inputs.test-track }}' -ne '') {
          $ctestArgs += @('--track', '${{ inputs.test-track }}')
        }
        if ('${{ inputs.ctest-extra-args }}' -ne '') {
          $ctestArgs += '${{ inputs.ctest-extra-args }}'.Split(' ')
        }
        ctest -C Release -M ${{ inputs.test-model }} -T Start -T Test `
          --output-on-failure --no-compress-output --timeout 600 @ctestArgs
        if ($LASTEXITCODE -ne 0) {
          throw "PlusLib tests failed with exit code $LASTEXITCODE"
        }

    # PlusApp has its own test suite and CDash project, in build/PlusApp-bin.
    - name: Test PlusApp
      id: plusapp-tests
      if: ${{ inputs.run-tests && hashFiles('build/PlusApp-bin/CTestTestfile.cmake') != '' }}
      shell: pwsh
      working-directory: ${{ github.workspace }}/build/PlusApp-bin
      run: |
        $ctestArgs = @()
        if ('${{ inputs.test-track }}' -ne '') {
          $ctestArgs += @('--track', '${{ inputs.test-track }}')
        }
        ctest -C Release -M ${{ inputs.test-model }} -T Start -T Test `
          --output-on-failure --no-compress-output --timeout 600 @ctestArgs
        if ($LASTEXITCODE -ne 0) {
          throw "PlusApp tests failed with exit code $LASTEXITCODE"
        }

    # Separate from the test step so that a CDash outage cannot fail the job.
    - name: Submit test results to CDash
      if: ${{ always() && steps.plus-tests.outcome != 'skipped' }}
      continue-on-error: true
      shell: pwsh
      working-directory: ${{ github.workspace }}/build/PlusLib-bin
      run: |
        ctest -M ${{ inputs.test-model }} -T Submit
        if ('${{ steps.plusapp-tests.outcome }}' -ne 'skipped') {
          Set-Location "${{ github.workspace }}/build/PlusApp-bin"
          ctest -M ${{ inputs.test-model }} -T Submit
        }

    - name: Upload test logs
      if: ${{ always() && steps.plus-tests.outcome != 'skipped' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.archive-name }}-TestLogs
        if-no-files-found: warn
        path: |
          build/PlusLib-bin/Testing/Temporary/LastTest*.log
          build/PlusLib-bin/Testing/Temporary/LastTestsFailed*.log
          build/PlusLib-bin/Testing/**/Test.xml
          build/PlusApp-bin/Testing/Temporary/LastTest*.log
          build/PlusApp-bin/Testing/Temporary/LastTestsFailed*.log
          build/PlusApp-bin/Testing/**/Test.xml

    - uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1.13.1
    - name: Package
      if: ${{ contains(runner.os, 'windows') && hashFiles('build/PlusApp-bin/CreatePackage.bat') != '' }}
      working-directory: ${{ github.workspace }}/build/PlusApp-bin
      shell: pwsh
      run: |
        .\CreatePackage.bat

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.archive-name }}
        path: ${{github.workspace}}/build/PlusApp-bin/*.exe

    # Delete the installer so that it isn't included in the cache.
    - name: Delete installer
      shell: bash
      run: |
        rm -rfv build/PlusApp-bin/*.exe
        rm -rfv build/PlusApp-bin/*.zip
        rm -rfv build/PlusApp-bin/_CPack_Packages
